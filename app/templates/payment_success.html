<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرداخت موفق</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Tahoma, sans-serif; background: #0D1117; color: #E6EDF3; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #161B22; border: 1px solid #2A3441; border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; text-align: center; }
        .success-icon { font-size: 64px; margin-bottom: 20px; }
        .success-title { font-size: 20px; font-weight: 800; color: #3DD68C; margin-bottom: 8px; }
        .success-sub { font-size: 13px; color: #8B98A8; margin-bottom: 28px; }
        .info-box { background: #1C2333; border-radius: 10px; padding: 16px; margin-bottom: 24px; }
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #2A3441; }
        .info-row:last-child { border-bottom: none; }
        .info-label { font-size: 12px; color: #8B98A8; }
        .info-value { font-size: 13px; font-weight: 600; }
        .info-value.green { color: #3DD68C; }
        .btn { display: block; padding: 12px 24px; border-radius: 8px; border: none; font-family: Tahoma, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; background: linear-gradient(135deg, #F5A623, #E8833A); color: #000; }
    </style>
</head>
<body>
    <div class="card">
        <div class="success-icon">✅</div>
        <div class="success-title">پرداخت موفق!</div>
        <div class="success-sub">موجودی کیف پول شما با موفقیت شارژ شد</div>
        <div class="info-box">
            <div class="info-row">
                <div class="info-label">مبلغ شارژ شده</div>
                <div class="info-value green">{{ "{:,}".format(amount) }} ریال</div>
            </div>
            <div class="info-row">
                <div class="info-label">موجودی فعلی</div>
                <div class="info-value">{{ "{:,}".format(balance) }} ریال</div>
            </div>
            <div class="info-row">
                <div class="info-label">نام راننده</div>
                <div class="info-value">{{ driver.full_name }}</div>
            </div>
        </div>
        <a href="/driver/{{ driver.id }}/queue" class="btn">برگشت به نوبت‌گیری ←</a>
    </div>
</body>
</html>
